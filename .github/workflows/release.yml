# Every push to main builds MoneyTalks.app, smoke-tests it, packages it as a
# .dmg and publishes a GitHub release.
#
# Version: MAJOR.MINOR from pyproject.toml + this workflow's run number as
# PATCH (e.g. 0.2.14). Bump `version` in pyproject.toml to start a new series.
name: Release macOS app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write  # create tags and releases

concurrency:
  group: release-macos
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    # Apple Silicon (arm64). "latest" follows GitHub's supported macOS image,
    # so image retirements (macos-14 was retired Nov 2026) don't break releases.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-app.txt

      - name: Install dependencies
        run: pip install -r requirements-app.txt

      - name: Work out the version
        id: version
        run: |
          base=$(python -c "import tomllib; v = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']; print('.'.join(v.split('.')[:2]))")
          echo "version=${base}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build MoneyTalks.app and .dmg
        run: packaging/build_macos.sh "${{ steps.version.outputs.version }}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Same file name every release, so the README's download button can link to
          # releases/latest/download/MoneyTalks.dmg. The version is in the label,
          # the release title and the disk image's volume name.
          cp "dist/MoneyTalks-${VERSION}.dmg" dist/MoneyTalks.dmg
          gh release create "v${VERSION}" "dist/MoneyTalks.dmg#MoneyTalks ${VERSION} for macOS (Apple Silicon)" \
            --target "${GITHUB_SHA}" \
            --title "MoneyTalks ${VERSION}" \
            --generate-notes
