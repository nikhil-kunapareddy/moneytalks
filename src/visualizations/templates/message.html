<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MoneyTalks</title>
<link rel="icon" type="image/png" href="__ICON__">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--page:#cfcfcf;--frame:#f2f2f2;--card:#f9f9f9;--ink:#111111;--muted:#6a6a6a}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--page);font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;padding:24px 16px;min-height:100vh;display:flex}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
.frame{flex:1;max-width:1280px;margin:0 auto;background:var(--frame);border-radius:32px;padding:24px 26px 26px;border:1px solid rgba(255,255,255,.75);box-shadow:0 40px 80px -40px rgba(0,0,0,.25);display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:10px;font-size:23px;font-weight:500;letter-spacing:-.02em}
.logo{width:36px;height:36px;border-radius:9px;box-shadow:0 0 0 1px rgba(0,0,0,.05),0 4px 10px -4px rgba(0,0,0,.25)}
.center{flex:1;display:grid;place-items:center;padding:40px 0}
.card{width:min(520px,100%);background:var(--card);border-radius:24px;padding:40px 36px 34px;text-align:center;box-shadow:0 0 0 1px rgba(255,255,255,.9) inset,0 0 0 1px rgba(0,0,0,.035),0 2px 6px -2px rgba(0,0,0,.05)}
.hero-icon{width:96px;height:96px;border-radius:22px;box-shadow:0 10px 24px -10px rgba(0,0,0,.3)}
h1{font-size:28px;font-weight:500;letter-spacing:-.025em;margin:24px 0 10px}
p{font-size:14.5px;line-height:1.55;color:var(--muted);margin:0;white-space:pre-line;overflow-wrap:anywhere}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:26px}
.btn{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 18px;border-radius:13px;font-size:13.5px;font-weight:500;background:#1c1c1c;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 4px 10px -3px rgba(0,0,0,.4)}
.btn.grey{background:#e9e9e9;color:#111;box-shadow:0 0 0 1px rgba(0,0,0,.035)}
.btn:disabled{opacity:.6;cursor:progress}
.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:50;background:#1c1c1c;color:#fff;font-size:13px;line-height:1.45;padding:10px 16px;border-radius:12px;box-shadow:0 12px 30px -10px rgba(0,0,0,.45);max-width:min(640px,calc(100% - 32px))}
.toast[hidden]{display:none}
</style>
</head>
<body>
<div class="frame">
  <header class="brand"><img class="logo" src="__ICON__" alt="" width="36" height="36">moneytalks</header>
  <main class="center">
    <section class="card">
      <img class="hero-icon" src="__ICON__" alt="">
      <h1 id="title"></h1>
      <p id="body"></p>
      <div class="actions" id="actions"></div>
    </section>
  </main>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
const MSG = /*__DATA__*/null;
const $ = s => document.querySelector(s);
const LABELS = {import: 'Import statement', retry: 'Try again'};

function showToast(text) {
  const t = $('#toast');
  t.textContent = text; t.hidden = false;
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(() => { t.hidden = true; }, 7000);
}

function render() {
  $('#title').textContent = MSG.title;
  $('#body').textContent = MSG.body;
  const box = $('#actions');
  box.innerHTML = '';
  MSG.actions.forEach((action, i) => {
    const b = document.createElement('button');
    b.className = 'btn' + (i ? ' grey' : '');
    b.textContent = LABELS[action];
    b.onclick = async () => {
      const api = window.pywebview && window.pywebview.api;
      if (!api) { showToast('This button works in the MoneyTalks app.'); return; }
      b.disabled = true;
      try { await (action === 'import' ? api.import_statements() : api.refresh()); }
      catch (e) { showToast('Something went wrong: ' + (e && e.message ? e.message : e)); }
      finally { b.disabled = false; }
    };
    box.appendChild(b);
  });
  if (MSG.notice) showToast(MSG.notice);
}
render();
</script>
</body>
</html>
