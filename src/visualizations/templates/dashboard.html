<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MoneyTalks Overview</title>
<link rel="icon" type="image/png" href="__ICON__">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --page:#cfcfcf;
  --frame:#f2f2f2;
  --card:#f9f9f9;
  --ink:#111111;
  --muted:#8a8a8a;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;padding:24px 16px 56px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
svg{display:block}

/* ---------- frame ---------- */
.frame{max-width:1280px;margin:0 auto;background:var(--frame);border-radius:32px;padding:24px 26px 26px;border:1px solid rgba(255,255,255,.75);box-shadow:0 40px 80px -40px rgba(0,0,0,.25)}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-size:23px;font-weight:500;letter-spacing:-.02em}
.logo{width:36px;height:36px;border-radius:9px;box-shadow:0 0 0 1px rgba(0,0,0,.05),0 4px 10px -4px rgba(0,0,0,.25)}
.tools{display:flex;gap:10px;align-items:center}
.circle{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#f4f4f4;box-shadow:0 0 0 1px rgba(0,0,0,.05),0 3px 8px -4px rgba(0,0,0,.18)}
.bell{position:relative}
.bell::after{content:"";position:absolute;top:11px;right:12px;width:6px;height:6px;border-radius:50%;background:#ef4444;box-shadow:0 0 0 1.5px #f4f4f4}
.avatar{width:44px;height:44px;border-radius:50%;padding:2px;background:conic-gradient(from 200deg,#f59e0b,#ec4899,#8b5cf6,#f59e0b)}
.avatar div{width:100%;height:100%;border-radius:50%;background:linear-gradient(160deg,#ecebe8,#cfcac4);display:grid;place-items:center;border:2px solid #f2f2f2}

.titlerow{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-top:26px;flex-wrap:wrap}
.title{display:flex;align-items:flex-start;gap:8px}
h1{font-size:46px;font-weight:400;letter-spacing:-.035em;margin:0;line-height:1}
.linkbtn{width:30px;height:30px;border-radius:50%;background:#fbfbfb;display:grid;place-items:center;box-shadow:0 0 0 1px rgba(0,0,0,.05),0 4px 10px -4px rgba(0,0,0,.2);margin-top:-12px}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill.white{background:#fafafa;box-shadow:0 0 0 1px rgba(0,0,0,.05),0 2px 6px -3px rgba(0,0,0,.18)}
.pill{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 14px;border-radius:13px;font-size:12.5px;font-weight:500;white-space:nowrap}
.pill.grey{background:#e9e9e9;box-shadow:0 0 0 1px rgba(0,0,0,.035)}
.pill:disabled{opacity:.6;cursor:progress}
.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:50;background:#1c1c1c;color:#fff;font-size:13px;line-height:1.45;padding:10px 16px;border-radius:12px;box-shadow:0 12px 30px -10px rgba(0,0,0,.45);max-width:min(640px,calc(100% - 32px))}
.toast[hidden]{display:none}
.menuwrap{position:relative}
.menu{position:absolute;top:48px;right:0;z-index:20;background:#fff;border-radius:12px;padding:5px;min-width:130px;box-shadow:0 0 0 1px rgba(0,0,0,.06),0 12px 30px -10px rgba(0,0,0,.25);display:none}
.menu.open{display:block}
.menu button{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:8px;font-size:12.5px}
.menu button:hover,.menu button.on{background:#f1f1f1}

/* ---------- grid ---------- */
.grid{display:grid;grid-template-columns:.74fr 1.26fr 1fr;grid-template-rows:392px 168px 168px;gap:12px;margin-top:22px}
.card{background:var(--card);border-radius:24px;padding:20px 20px;position:relative;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.9) inset,0 0 0 1px rgba(0,0,0,.035),0 2px 6px -2px rgba(0,0,0,.05)}
.hero{grid-column:1/3;grid-row:1;display:flex;flex-direction:column}
.side{grid-column:3;grid-row:1}
.left{grid-column:1;grid-row:2/4;display:flex;flex-direction:column}
.mid1{grid-column:2;grid-row:2}
.mid2{grid-column:2;grid-row:3}
.insight{grid-column:3;grid-row:2/4}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.head h2{font-size:19px;font-weight:500;letter-spacing:-.015em;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.more{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#fbfbfb;box-shadow:0 0 0 1px rgba(0,0,0,.07)}

/* hero (stepped bars) */
.hero-body{position:relative;flex:1;margin:12px -20px -20px}
.cols{position:absolute;top:0;bottom:0;left:66px;right:0;display:grid}
.col{border-left:1px solid #ececec;padding:0 14px;cursor:default;transition:background .25s}
.col.on{background:linear-gradient(180deg,rgba(255,255,255,0) 0%,rgba(236,241,255,.9) 38%,rgba(205,220,255,.95) 100%)}
.clab{font-size:12.5px;color:#b5b5b5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cval{font-size:26px;color:#b9b9b9;letter-spacing:-.025em;margin-top:5px}
.col.on .clab{color:#262626}
.col.on .cval{color:#111}
svg.bars{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.yaxis span{position:absolute;left:20px;font-size:12px;color:#8e8e8e;transform:translateY(-50%)}
.tip{position:absolute;z-index:3;white-space:nowrap;font-size:12.5px;color:#717171;background:rgba(255,255,255,.86);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-radius:12px;padding:7px 12px;pointer-events:none;box-shadow:0 0 0 1px rgba(0,0,0,.06),0 0 0 3px rgba(255,255,255,.6),0 8px 20px -8px rgba(40,70,160,.35);transition:left .2s,top .2s}
.tip b{color:#111;font-weight:600}
.tip i{font-style:normal;color:#c4c4c4;margin:0 6px}

/* side (total + top merchants) */
.bigrow{display:flex;align-items:center;gap:16px;margin:30px 0 22px}
.big{font-size:56px;font-weight:400;letter-spacing:-.04em;line-height:1;white-space:nowrap}
.big small{font-size:.46em;color:#a3a3a3;letter-spacing:-.01em}
.badge{display:inline-flex;align-items:center;gap:6px;background:#fff;border-radius:10px;padding:6px 10px;font-size:13px;font-weight:500;white-space:nowrap;box-shadow:0 0 0 1px rgba(0,0,0,.04),0 6px 14px -6px rgba(0,0,0,.22)}
.sep{border:0;border-top:1px solid #e6e6e6;margin:0 0 16px}
.row{margin-bottom:17px}
.rl{display:flex;justify-content:space-between;gap:10px;font-size:14.5px;color:#6a6a6a;margin-bottom:9px}
.rl span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rl b{color:#111;font-weight:600}
.track{height:11px;border-radius:7px;background:#fff;box-shadow:inset 0 0 0 1px #efefef}
.fill{height:100%;border-radius:7px;min-width:12px}
.fill.g{background:repeating-linear-gradient(135deg,#3ccb5c 0 3px,#1f9b3c 3px 5px)}
.fill.b{background:repeating-linear-gradient(135deg,#4a90ff 0 3px,#2160e8 3px 5px)}
.fill.p{background:repeating-linear-gradient(135deg,#ffaad6 0 3px,#f06aa9 3px 5px)}

/* left (step chart) */
.stepwrap{position:relative;flex:1;margin:14px 0 0}
.stepwrap svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.steptip{position:absolute;z-index:2;transform:translate(-50%,-100%);background:#fff;border-radius:9px;padding:5px 9px;font-size:12px;font-weight:600;white-space:nowrap;pointer-events:none;box-shadow:0 0 0 1px rgba(0,0,0,.05),0 6px 14px -6px rgba(0,0,0,.25)}
.steptip span{font-weight:400;color:#8a8a8a;margin-left:4px}
.xlabs{display:flex;justify-content:space-between;font-size:11.5px;color:#8c8c8c;margin-top:10px}

/* mid (weekday dots) */
.mid{display:flex;flex-direction:column}
.mbody{flex:1;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:end;gap:14px}
.mnum{font-size:46px;letter-spacing:-.04em;line-height:.85;white-space:nowrap}
.dots{display:flex;align-items:flex-end;gap:10px}
.grp{position:relative;display:flex;flex-direction:column-reverse;gap:3px}
.grp .r{display:flex;gap:3px;height:9px}
.dot{width:9px;height:9px;border-radius:50%}
.peak{position:absolute;bottom:calc(100% + 12px);left:50%;transform:translateX(-50%);background:#fff;border-radius:9px;padding:5px 9px;font-size:11.5px;white-space:nowrap;color:#8a8a8a;box-shadow:0 0 0 1px rgba(0,0,0,.05),0 6px 14px -6px rgba(0,0,0,.25)}
.peak b{color:#111;font-weight:600}
.mright{text-align:right;justify-self:end}
.mright div:first-child{font-size:12.5px;color:#8a8a8a;margin-bottom:8px;white-space:nowrap}
.mright div:last-child{font-size:18px;font-weight:500;letter-spacing:-.01em;white-space:nowrap}

/* insight */
.insight{color:#fff;display:flex;flex-direction:column;padding:18px 20px 20px;box-shadow:none;background:#1b3fd0}
.insight .bg{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.insight > :not(.bg){position:relative;z-index:1}
.ins-pill{align-self:flex-start;display:inline-flex;gap:6px;align-items:center;font-size:12.5px;padding:7px 11px;border-radius:10px;background:rgba(255,255,255,.14);box-shadow:inset 0 0 0 1px rgba(255,255,255,.35);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.ins-slide{margin-top:auto;transition:opacity .35s}
.ins-slide.fade{opacity:0}
.ins-big{font-size:68px;font-weight:300;letter-spacing:-.045em;line-height:1}
.ins-head{font-size:19px;font-weight:600;line-height:1.28;margin-top:18px;letter-spacing:-.01em;text-wrap:balance}
.ins-sub{font-size:13px;line-height:1.5;color:rgba(255,255,255,.86);margin-top:12px}
.ins-bars{display:flex;gap:6px;margin-top:22px}
.ins-bars button{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.32)}
.ins-bars button.on{background:#fff}

@media (max-width:1060px){
  .grid{grid-template-columns:1fr 1fr;grid-template-rows:392px 392px 330px 168px 168px}
  .hero{grid-column:1/3;grid-row:1}
  .side{grid-column:1;grid-row:2}
  .insight{grid-column:2;grid-row:2}
  .left{grid-column:1/3;grid-row:3}
  .mid1{grid-column:1/3;grid-row:4}
  .mid2{grid-column:1/3;grid-row:5}
}
@media (max-width:640px){
  .frame{padding:16px;border-radius:24px}
  h1{font-size:36px}
  .grid{grid-template-columns:1fr;grid-template-rows:none;grid-auto-rows:auto}
  .hero,.side,.insight,.left,.mid1,.mid2{grid-column:1;grid-row:auto}
  .hero{height:392px}.left{height:300px}.insight{height:330px}.mid1,.mid2{height:200px}
  .mbody{grid-template-columns:1fr auto}
  .dots{grid-column:1/-1;grid-row:1;justify-self:center}
}
</style>
</head>
<body>

<div class="frame">
  <header class="top">
    <div class="brand">
      <img class="logo" src="__ICON__" alt="" width="36" height="36">
      moneytalks
    </div>
    <div class="tools">
      <button class="circle" aria-label="Search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
      <button class="circle bell" aria-label="Notifications"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></button>
      <div class="avatar"><div><svg width="20" height="20" viewBox="0 0 24 24" fill="#8f8a84"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0z"/></svg></div></div>
    </div>
  </header>

  <div class="titlerow">
    <div class="title"><h1>Overview</h1><button class="linkbtn" aria-label="Copy link"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1b1b1b" stroke-width="2.4" stroke-linecap="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg></button></div>
    <div class="controls">
      <div class="pill white"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg><span id="rangeCur"></span></div>
      <div class="menuwrap">
        <button class="pill grey" id="granBtn"><span id="granLabel">Daily</span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#1b1b1b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
        <div class="menu" id="granMenu"><button data-g="daily" class="on">Daily</button><button data-g="weekly">Weekly</button><button data-g="monthly">Monthly</button></div>
      </div>
      <button class="pill grey" id="importBtn"><span>Import statement</span><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
  </div>

  <main class="grid">
    <section class="card hero">
      <div class="head"><h2>Spending by Category</h2><button class="more" aria-label="More"><svg width="16" height="4" viewBox="0 0 16 4" fill="#1b1b1b"><circle cx="2" cy="2" r="1.6"/><circle cx="8" cy="2" r="1.6"/><circle cx="14" cy="2" r="1.6"/></svg></button></div>
      <div class="hero-body" id="heroBody"></div>
    </section>

    <section class="card side">
      <div class="head"><h2>Total Spent</h2><button class="more" aria-label="More"><svg width="16" height="4" viewBox="0 0 16 4" fill="#1b1b1b"><circle cx="2" cy="2" r="1.6"/><circle cx="8" cy="2" r="1.6"/><circle cx="14" cy="2" r="1.6"/></svg></button></div>
      <div class="bigrow"><div class="big" id="sideBig"></div><div class="badge" id="sideBadge"></div></div>
      <hr class="sep">
      <div id="sideRows"></div>
    </section>

    <section class="card left">
      <div class="head"><h2 id="leftTitle">Daily Spending</h2><button class="more" aria-label="More"><svg width="16" height="4" viewBox="0 0 16 4" fill="#1b1b1b"><circle cx="2" cy="2" r="1.6"/><circle cx="8" cy="2" r="1.6"/><circle cx="14" cy="2" r="1.6"/></svg></button></div>
      <div class="stepwrap" id="stepwrap"></div>
      <div class="xlabs" id="xlabs"></div>
    </section>

    <section class="card mid mid1" id="mid1"></section>
    <section class="card mid mid2" id="mid2"></section>

    <section class="card insight">
      <svg class="bg" viewBox="0 0 400 360" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <defs>
          <linearGradient id="ig" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0" stop-color="#0b0f3a"/>
            <stop offset=".22" stop-color="#1a3fd2"/>
            <stop offset=".46" stop-color="#4f8fe3"/>
            <stop offset=".62" stop-color="#9cc6dc"/>
            <stop offset=".8" stop-color="#f3b48c"/>
            <stop offset="1" stop-color="#f2762c"/>
          </linearGradient>
          <radialGradient id="ig2" cx=".95" cy=".05" r=".6"><stop offset="0" stop-color="#ff8a3d" stop-opacity=".85"/><stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/></radialGradient>
          <radialGradient id="ig3" cx="0" cy="1" r=".55"><stop offset="0" stop-color="#070a2a" stop-opacity=".9"/><stop offset="1" stop-color="#070a2a" stop-opacity="0"/></radialGradient>
          <linearGradient id="glassFill" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".05"/><stop offset="1" stop-color="#fff" stop-opacity=".32"/></linearGradient>
          <linearGradient id="glassEdge" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".5" stop-color="#fff" stop-opacity=".2"/><stop offset="1" stop-color="#fff" stop-opacity=".7"/></linearGradient>
          <filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
          <filter id="soft"><feGaussianBlur stdDeviation="1.4"/></filter>
        </defs>
        <rect width="400" height="360" fill="url(#ig)"/>
        <rect width="400" height="360" fill="url(#ig2)"/>
        <rect width="400" height="360" fill="url(#ig3)"/>
        <path d="M188 112 L332 -40 Q346 -54 360 -40 L470 70 Q484 84 470 98 L326 250 Q312 264 298 250 Z" fill="url(#glassFill)" stroke="url(#glassEdge)" stroke-width="3"/>
        <path d="M206 108 L330 -22" stroke="#fff" stroke-opacity=".85" stroke-width="5" stroke-linecap="round" filter="url(#soft)"/>
        <path d="M300 40 L360 -10 L400 30 L400 80 Z" fill="#fff" fill-opacity=".14"/>
        <rect width="400" height="360" filter="url(#grain)" opacity=".26" style="mix-blend-mode:overlay"/>
      </svg>
      <div class="ins-pill"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1V17h6v-.2c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2z"/></svg>Insights</div>
      <div class="ins-slide" id="insSlide"><div class="ins-big" id="insBig"></div><div class="ins-head" id="insHead"></div><div class="ins-sub" id="insSub"></div></div>
      <div class="ins-bars" id="insBars"></div>
    </section>
  </main>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
const DATA = /*__DATA__*/null;
const $ = (s, el = document) => el.querySelector(s);
const money = v => '$' + v.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const money0 = v => '$' + Math.round(v).toLocaleString('en-US');
const moneySplit = v => { const [w, c] = money(v).split('.'); return `${w}<small>.${c}</small>`; };
const pct = v => Math.round(v * 100) + '%';
const sum = (a, f) => a.reduce((s, x) => s + f(x), 0);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const listJoin = a => a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1];
const MORE = '<button class="more" aria-label="More"><svg width="16" height="4" viewBox="0 0 16 4" fill="#1b1b1b"><circle cx="2" cy="2" r="1.6"/><circle cx="8" cy="2" r="1.6"/><circle cx="14" cy="2" r="1.6"/></svg></button>';

const T = DATA.totals, C = DATA.categories, M = DATA.merchants;

/* ---------- content ---------- */
const otherCats = C.length > 5 ? C.slice(4) : [];
const HERO_COLS = [
  ...C.slice(0, otherCats.length ? 4 : 5).map(c => ({label: c.label, value: c.amount, count: c.count, share: c.share})),
  ...(otherCats.length ? [{label: `Other (${otherCats.length})`, value: sum(otherCats, c => c.amount), count: sum(otherCats, c => c.count), share: sum(otherCats, c => c.share)}] : []),
];

const INSIGHTS = (() => {
  const out = [], c0 = C[0];
  const topFrac = Math.floor(c0.topMerchantAmount / c0.amount * 100);
  out.push({big: pct(c0.share), head: `${c0.label} was ${pct(c0.share)} of your spending this period.`,
    sub: topFrac >= 100 ? `All of it at ${c0.topMerchant}.` : `${c0.topMerchant} (${money(c0.topMerchantAmount)}) made up ${topFrac}% of it.`});
  if (C[1]) out.push({big: pct(C[1].share), head: `${C[1].label} came second at ${money(C[1].amount)}.`,
    sub: C[1].count === 1 ? `A single charge at ${C[1].topMerchant}.` : `${C[1].count} charges, led by ${C[1].topMerchant} (${money(C[1].topMerchantAmount)}).`});
  if (C.length > 3) { const s3 = sum(C.slice(0, 3), c => c.share); out.push({big: pct(s3), head: `Three categories made up ${pct(s3)} of your spending.`,
    sub: `${listJoin(C.slice(0, 3).map(c => c.label))}. The other ${C.length - 3} came to ${money(sum(C.slice(3), c => c.amount))}.`}); }
  return out.slice(0, 3);
})();

let heroHi = 0, gran = 'daily', insIdx = 0, insTimer;

/* ---------- hero: stepped bars ---------- */
function niceStep(max, target = 4) {
  const raw = max / target, p = Math.pow(10, Math.floor(Math.log10(raw)));
  for (const m of [1, 2, 2.5, 5, 10]) if (raw <= m * p) return m * p;
  return 10 * p;
}
const shortMoney = v => v >= 1000 ? '$' + (v / 1000).toFixed(v >= 10000 ? 0 : 1).replace(/\.0$/, '') + 'k' : '$' + Math.round(v);

function drawHero() {
  const body = $('#heroBody'), cols = HERO_COLS, n = cols.length;
  body.innerHTML = `<div class="yaxis"></div><div class="cols" style="grid-template-columns:repeat(${n},1fr)">${cols.map((c, i) =>
    `<div class="col${i === heroHi ? ' on' : ''}" data-i="${i}"><div class="clab" title="${esc(c.label)}">${esc(c.label)}</div><div class="cval">${money0(c.value)}</div></div>`).join('')}</div><svg class="bars"></svg><div class="tip" id="tip"></div>`;

  const br = body.getBoundingClientRect(), Wd = br.width, H = br.height;
  const G = 66, colW = (Wd - G) / n, bw = colW * 0.885;
  const zeroY = H, topY = 86;  // bars rise from the card's bottom edge
  const max = Math.max(...cols.map(c => c.value)) || 1, step = niceStep(max), niceMax = Math.ceil(max / step) * step;
  const y = v => zeroY - (v / niceMax) * (zeroY - topY);

  const ya = $('.yaxis', body);
  for (let t = step; t <= niceMax + 1e-6; t += step) ya.insertAdjacentHTML('beforeend', `<span style="top:${y(t)}px">${shortMoney(t)}</span>`);

  const svg = $('svg.bars', body);
  svg.setAttribute('viewBox', `0 0 ${Wd} ${H}`);
  let s = `<defs>
    <linearGradient id="barG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b4fe4"/><stop offset=".55" stop-color="#5b7ef0"/><stop offset="1" stop-color="#c9d6fd"/></linearGradient>
    <linearGradient id="barHi" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4e82fb"/><stop offset=".6" stop-color="#2450ea"/><stop offset="1" stop-color="#1b3cd4"/></linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b3caf6"/><stop offset=".5" stop-color="#d5e3fb"/><stop offset="1" stop-color="#eaf1fe"/></linearGradient>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect x="0" width="2.3" height="7" fill="#fff" fill-opacity=".9"/></pattern>
  </defs>`;
  cols.forEach((c, i) => {
    const x0 = G + i * colW, top = y(c.value), on = i === heroHi;
    if (i < n - 1) s += `<path d="M${x0 + bw} ${top} L${x0 + colW} ${y(cols[i + 1].value)} L${x0 + colW} ${H} L${x0 + bw} ${H} Z" fill="url(#side)"/>`;
    s += `<rect x="${x0}" y="${top}" width="${bw}" height="${H - top}" fill="url(#${on ? 'barHi' : 'barG'})"/>`;
    if (!on) {
      s += `<rect x="${x0}" y="${top}" width="${bw}" height="${H - top}" fill="url(#hatch)"/>`;
      s += `<rect x="${x0 + bw / 2 - 11}" y="${top - 13}" width="22" height="6" rx="3" fill="#b9cdf8" stroke="#fff" stroke-width="1.2"/>`;
    }
  });
  svg.innerHTML = s;

  const c = cols[heroHi], tip = $('#tip', body);
  tip.innerHTML = `<b>${money(c.value)}</b> spent<i>|</i>Share: <b>${pct(c.share)}</b><i>|</i>Charges: <b>${c.count}</b>`;
  tip.style.left = Math.min(G + heroHi * colW + bw * 0.38, Wd - tip.offsetWidth - 14) + 'px';
  tip.style.top = Math.max(y(c.value) - 44, 64) + 'px';

  body.querySelectorAll('.col').forEach(el => el.addEventListener('mouseenter', () => { heroHi = +el.dataset.i; drawHero(); }));
  $('.cols', body).addEventListener('mouseleave', () => { if (heroHi !== 0) { heroHi = 0; drawHero(); } });
}

/* ---------- side: total + top merchants ---------- */
function drawSide() {
  $('#sideBig').innerHTML = moneySplit(T.spent);
  $('#sideBadge').textContent = `${T.charges} charge${T.charges === 1 ? '' : 's'}`;
  const colors = ['g', 'b', 'p'];
  $('#sideRows').innerHTML = M.slice(0, 3).map((m, i) => `<div class="row"><div class="rl"><span title="${esc(m.name)}">${esc(m.name)}</span><b>${money(m.amount)}</b></div><div class="track"><div class="fill ${colors[i]}" style="width:${Math.max(m.share * 100, 2)}%"></div></div></div>`).join('');
}

/* ---------- left: step chart ---------- */
function series() {
  if (gran === 'weekly') return DATA.weekly;
  if (gran === 'monthly') return DATA.monthly;
  return DATA.daily;
}
function drawLeft(hover = null) {
  const wrap = $('#stepwrap'), pts = series(), n = pts.length;
  $('#leftTitle').textContent = {daily: 'Daily', weekly: 'Weekly', monthly: 'Monthly'}[gran] + ' Spending';
  const r = wrap.getBoundingClientRect(), Wd = r.width, H = r.height, padTop = 46;
  const max = Math.max(...pts.map(p => p.amount)) || 1;
  const yy = v => H - (v / max) * (H - padTop);
  const w = Wd / n;
  let line = `M0 ${yy(pts[0].amount)}`;
  pts.forEach((p, i) => { if (i) line += ` V${yy(p.amount)}`; line += ` H${(i + 1) * w}`; });
  const area = line + ` V${H} H0 Z`;
  const pick = hover ?? pts.reduce((b, p, i) => (p.amount > pts[b].amount ? i : b), 0);
  const pp = pts[pick], dx = pick * w + (pick ? 0 : w / 2), dy = yy(pp.amount);
  wrap.innerHTML = `<svg viewBox="0 0 ${Wd} ${H}" preserveAspectRatio="none">
    <defs>
      <pattern id="vl" width="5" height="10" patternUnits="userSpaceOnUse"><rect width="1.3" height="10" fill="#f39cc6"/></pattern>
      <linearGradient id="fadeG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity=".35"/></linearGradient>
      <mask id="fadeM"><rect width="${Wd}" height="${H}" fill="url(#fadeG)"/></mask>
    </defs>
    <path d="${area}" fill="#fde9f2" opacity=".55"/>
    <path d="${area}" fill="url(#vl)" mask="url(#fadeM)"/>
    <line x1="0" y1="${H}" x2="${Wd}" y2="${H}" stroke="#e4e4e4"/>
    <path d="${line}" fill="none" stroke="#e5338b" stroke-width="2.6" stroke-linejoin="round"/>
    <circle cx="${dx}" cy="${dy}" r="3.6" fill="#e5338b" stroke="#fff" stroke-width="1.5"/>
  </svg>
  <div class="steptip" style="left:${dx}px;top:${dy - 12}px">${money0(pp.amount)}<span>${esc(pp.label)}</span></div>`;
  const tipEl = $('.steptip', wrap), half = tipEl.offsetWidth / 2;
  tipEl.style.left = Math.min(Math.max(dx, half), Wd - half) + 'px';
  wrap.onmousemove = e => { const i = Math.min(n - 1, Math.max(0, Math.floor((e.clientX - r.left) / w))); if (i !== hover) drawLeft(i); };
  wrap.onmouseleave = () => drawLeft(null);
  const k = Math.min(6, n), idx = [...new Set(Array.from({length: k}, (_, j) => Math.round(j * (n - 1) / Math.max(k - 1, 1))))];
  $('#xlabs').innerHTML = idx.map(i => `<span>${esc(pts[i].label.split(' – ')[0].replace(/ 0(\d)/, ' $1'))}</span>`).join('');
}

/* ---------- middle: weekday dot grids ---------- */
function drawDots(id, cfg) {
  const g = cfg.groups, max = Math.max(...g.map(x => x.v));
  let unit = 1;
  for (const u of [1, 2, 5, 10, 20, 25, 50, 100, 200, 250, 500, 1000, 2000, 5000]) { unit = u; if (max / u <= 12) break; }
  const peak = g.reduce((b, x, i) => (x.v > g[b].v ? i : b), 0);
  const pal = cfg.color === 'green' ? ['#1e9b3d', '#a4dcb1', '#e3f3e7'] : ['#1f6ff0', '#b7d2fb', '#e5eefc'];
  const groups = g.map((x, i) => {
    const nd = x.v > 0 ? Math.max(1, Math.round(x.v / unit)) : 1;
    const color = x.v > 0 ? (i === peak ? pal[0] : pal[1]) : pal[2];
    let rows = '';
    for (let r = 0; r < Math.ceil(nd / 2); r++) rows += `<div class="r">${`<span class="dot" style="background:${color}"></span>`.repeat(Math.min(2, nd - r * 2))}</div>`;
    return `<div class="grp" title="${esc(x.tip)}">${rows}${i === peak ? `<div class="peak">${cfg.tag}: <b>${esc(x.label)}</b></div>` : ''}</div>`;
  }).join('');
  $('#' + id).innerHTML = `<div class="head"><h2>${esc(cfg.title)}</h2>${MORE}</div>
    <div class="mbody"><div class="mnum">${esc(cfg.value)}</div><div class="dots" title="${unit > 1 && cfg.money ? 'each dot ≈ ' + money0(unit) : ''}">${groups}</div><div class="mright"><div>${esc(cfg.right[0])}</div><div>${esc(cfg.right[1])}</div></div></div>`;
}

/* ---------- insights carousel ---------- */
function showInsight(i, animate = true) {
  insIdx = i;
  const ins = INSIGHTS[i], slide = $('#insSlide');
  const apply = () => {
    $('#insBig').textContent = ins.big; $('#insHead').textContent = ins.head; $('#insSub').textContent = ins.sub;
    $('#insBars').innerHTML = INSIGHTS.map((_, k) => `<button class="${k === i ? 'on' : ''}" aria-label="Insight ${k + 1}" data-k="${k}"></button>`).join('');
    $('#insBars').querySelectorAll('button').forEach(b => b.onclick = () => { showInsight(+b.dataset.k); restartTimer(); });
    slide.classList.remove('fade');
  };
  if (animate) { slide.classList.add('fade'); setTimeout(apply, 250); } else apply();
}
function restartTimer() {
  clearInterval(insTimer);
  if (INSIGHTS.length > 1) insTimer = setInterval(() => showInsight((insIdx + 1) % INSIGHTS.length), 6000);
}

/* ---------- wiring ---------- */
function render() {
  $('#rangeCur').textContent = DATA.period.label;
  drawHero(); drawSide(); drawLeft();
  drawDots('mid1', {title: 'Transactions', value: String(T.charges), color: 'green', tag: 'Peak',
    groups: DATA.weekday.map(w => ({label: w.day, v: w.count, tip: `${w.day}: ${w.count} charges`})),
    right: ['avg per charge', money(T.avg)]});
  drawDots('mid2', {title: 'Merchants', value: String(T.merchants), color: 'blue', tag: 'Highest', money: true,
    groups: DATA.weekday.map(w => ({label: w.day, v: w.amount, tip: `${w.day}: ${money(w.amount)}`})),
    right: ['biggest charge', money(DATA.biggest.amount)]});
  showInsight(0, false); restartTimer();
  wireDesktop();
  if (DATA.notice) showToast(DATA.notice);
}

/* ---------- Mac app bridge (pywebview) ---------- */
function showToast(text) {
  const t = $('#toast');
  t.textContent = text; t.hidden = false;
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(() => { t.hidden = true; }, 7000);
}
function wireDesktop() {
  const btn = $('#importBtn'), api = window.pywebview && window.pywebview.api;
  if (!api || !api.import_statements) { btn.title = 'Import from the terminal: python cli.py import data/'; return; }
  btn.title = 'Import PDF or CSV statements';
  btn.onclick = async () => {
    const label = $('span', btn);
    btn.disabled = true; label.textContent = 'Importing…';
    try { await api.import_statements(); }  // on success the app reloads this page
    catch (e) { showToast('Import failed: ' + (e && e.message ? e.message : e)); }
    finally { btn.disabled = false; label.textContent = 'Import statement'; }
  };
}
window.addEventListener('pywebviewready', wireDesktop);

$('#granBtn').onclick = e => { e.stopPropagation(); $('#granMenu').classList.toggle('open'); };
document.addEventListener('click', () => $('#granMenu').classList.remove('open'));
$('#granMenu').querySelectorAll('button').forEach(b => b.onclick = () => {
  gran = b.dataset.g; $('#granLabel').textContent = b.textContent;
  $('#granMenu').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  drawLeft();
});
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { drawHero(); drawLeft(); }, 80); });

(document.fonts ? document.fonts.ready : Promise.resolve()).then(render);
</script>
</body>
