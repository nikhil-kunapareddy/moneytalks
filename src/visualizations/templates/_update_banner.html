<!-- Mac app only: update status banner, driven by window.mtUpdate(state) from src/desktop.py -->
<style>
.upd{position:fixed;right:18px;bottom:18px;z-index:60;display:flex;align-items:center;gap:14px;background:#1c1c1c;color:#fff;font-size:13px;line-height:1.4;padding:10px 12px 10px 16px;border-radius:14px;box-shadow:0 14px 34px -12px rgba(0,0,0,.5);max-width:min(560px,calc(100% - 36px))}
.upd[hidden]{display:none}
.upd .msg{min-width:0}
.upd .bar{height:3px;border-radius:2px;background:rgba(255,255,255,.2);margin-top:7px;overflow:hidden;width:240px;max-width:100%}
.upd .bar i{display:block;height:100%;background:#fff;transition:width .3s}
.upd button{flex:none;height:32px;padding:0 12px;border-radius:9px;background:#fff;color:#111;font:inherit;font-size:12.5px;font-weight:600;border:0;cursor:pointer}
.upd button.link{background:transparent;color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
.upd button:disabled{opacity:.6;cursor:progress}
</style>
<div class="upd" id="updBanner" role="status" hidden></div>
<script>
(() => {
  const box = document.getElementById('updBanner');
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
  let hideTimer;
  window.mtUpdate = s => {
    clearTimeout(hideTimer);
    let html = '', autoHide = 0;
    switch (s.state) {
      case 'checking':
        html = '<div class="msg">Checking for updates…</div>'; break;
      case 'downloading':
        html = `<div class="msg">Downloading MoneyTalks ${esc(s.version)}… ${s.progress || 0}%<div class="bar"><i style="width:${s.progress || 0}%"></i></div></div>`; break;
      case 'ready':
        html = `<div class="msg">MoneyTalks ${esc(s.version)} is ready. It installs when you quit.</div><button data-act="restart">Restart to update</button>`; break;
      case 'current':
        html = `<div class="msg">MoneyTalks ${esc(s.current)} is up to date.</div>`; autoHide = 4000; break;
      case 'blocked':
        html = `<div class="msg">MoneyTalks ${esc(s.version)} is available. ${esc(s.message)}</div><button class="link" data-act="page">Download page</button>`; break;
      case 'error':
        html = `<div class="msg">Couldn't check for updates. ${esc(s.message)}</div>`; autoHide = 8000; break;
      default:
        box.hidden = true; return;
    }
    box.innerHTML = html;
    box.hidden = false;
    const api = window.pywebview && window.pywebview.api;
    box.querySelectorAll('button').forEach(b => b.onclick = () => {
      if (!api) return;
      if (b.dataset.act === 'restart') { b.disabled = true; b.textContent = 'Restarting…'; api.restart_to_update(); }
      if (b.dataset.act === 'page') api.open_url(s.url);
    });
    if (autoHide) hideTimer = setTimeout(() => { box.hidden = true; }, autoHide);
  };
})();
</script>
